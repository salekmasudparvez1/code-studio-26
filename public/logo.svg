<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
    <defs>
        <linearGradient id="brand" x1="20" y1="10" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#38BDF8" />
            <stop offset="0.55" stop-color="#3B82F6" />
            <stop offset="1" stop-color="#8B5CF6" />
        </linearGradient>
    </defs>

    <!-- Icon background -->
    <rect x="8" y="12" width="96" height="96" rx="25" fill="#111827" />

    <!-- Code brackets -->
    <path d="M40 42 25 60 40 78" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M72 42 87 60 72 78" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slash -->
    <path d="M63 35 49 85" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" />

    <!-- Wordmark -->
    <text x="122" y="69" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="750" letter-spacing="-1.5"
        fill="#F8FAFC">Code</text>

    <text x="226" y="69" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="750" letter-spacing="-1.5"
        fill="url(#brand)">Studio</text>

    <!-- Tagline -->
    <text x="124" y="91" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="3"
        fill="#94A3B8">CREATE · CODE · ANIMATE</text>
</svg>